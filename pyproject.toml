[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "PicMetadata"
version = "0.2.1"
description = "A tool to fix and manage EXIF date metadata in image files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "piexif>=1.1.3",
]

[project.scripts]
picmetadata = "main:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", ".venv*"]