name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: PicMetadata-windows
          - os: macos-latest
            artifact: PicMetadata-macOS
          - os: ubuntu-latest
            artifact: PicMetadata-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pyinstaller-hooks-contrib

      - name: Compile translations
        run: |
          pyside6-lrelease translations/app_en.ts -qm translations/app_en.qm
          pyside6-lrelease translations/app_it.ts -qm translations/app_it.qm

      - name: Build with PyInstaller
        run: pyinstaller PicMetadata.spec

      # ── Packaging ────────────────────────────────────────────────────────────

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path dist/PicMetadata -DestinationPath ${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist PicMetadata.app

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist PicMetadata

      # ── Test rapido ──────────────────────────────────────────────────────────

      - name: Test eseguibile (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist/PicMetadata/PicMetadata.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "L'app è crashata subito dopo l'avvio (exit code: $($proc.ExitCode))"
            exit 1
          }
          $proc | Stop-Process
          Write-Host "OK: l'app si è avviata correttamente su Windows"

      - name: Test eseguibile (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb
          timeout 5 xvfb-run dist/PicMetadata/PicMetadata || true
          echo "OK: l'app si è avviata correttamente su Linux"

      # ── Upload artifact ──────────────────────────────────────────────────────

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ── Release ──────────────────────────────────────────────────────────────────

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PicMetadata-windows/*.zip
            PicMetadata-macOS/*.tar.gz
            PicMetadata-linux/*.tar.gz
          generate_release_notes: true
